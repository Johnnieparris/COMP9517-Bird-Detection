# Paths are relative to the repository. A fresh run directory is created each time.
model: yolo11n.pt
data_root: data/augmented_birds_baseline
augmentation_copies: 1
augmentation_seed: 42
epochs: 5
imgsz: 640
batch: 8
nbs: 16
device: auto
workers: 0
optimizer: AdamW
lr0: 0.0003
lrf: 0.1
weight_decay: 0.0001
warmup_epochs: 1.0
warmup_bias_lr: 0.0
cos_lr: true
seed: 42
deterministic: true
amp: false
patience: 0
# Offline augmentation is generated once and recorded in the run metadata.
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
degrees: 0.0
translate: 0.0
scale: 0.0
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.0
mosaic: 0.0
mixup: 0.0
cutmix: 0.0
copy_paste: 0.0
bgr: 0.0
close_mosaic: 0
